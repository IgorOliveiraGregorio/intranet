<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Portal da Intranet</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Portal da Intranet</a>
  </header>
  <main class="page-center">
    <section class="card">
      <h1 class="page-title">Entrar</h1>
      <p class="intro">Use o nome de usuário e a senha cadastrados.</p>

      <div id="notice" class="alert alert-ok" role="status" hidden></div>
      <div id="alert" class="alert alert-error" role="alert" hidden></div>

      <form id="login-form" method="post" novalidate>
        <div class="field">
          <label for="username">Nome de usuário</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required aria-describedby="username-error">
          <p class="field-error" id="username-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="password-error">
            <button type="button" class="toggle-pass" data-toggle-for="password" aria-pressed="false">Mostrar</button>
          </div>
          <p class="field-error" id="password-error" aria-live="polite"></p>
        </div>
        <button class="btn btn-block" type="submit" id="submit">Entrar</button>
      </form>

      <p class="switch">Ainda não tem conta? <a href="/register">Criar conta</a></p>
    </section>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
