<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Portal da Intranet</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Portal da Intranet</a>
  </header>
  <main class="page-center">
    <section class="card">
      <h1 class="page-title">Criar conta</h1>
      <p class="intro">Preencha os dados abaixo. Todos os campos são obrigatórios.</p>

      <div id="alert" class="alert alert-error" role="alert" hidden></div>

      <form id="register-form" method="post" novalidate>
        <div class="field">
          <label for="username">Nome de usuário</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="30" required aria-describedby="username-hint username-error">
          <p class="hint" id="username-hint">3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.</p>
          <p class="field-error" id="username-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="email-error">
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="phone">Telefone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="(11) 91234-5678" required aria-describedby="phone-error">
          <p class="field-error" id="phone-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required aria-describedby="password-hint password-error">
            <button type="button" class="toggle-pass" data-toggle-for="password" aria-pressed="false">Mostrar</button>
          </div>
          <p class="hint" id="password-hint">Ao menos 10 caracteres, com letra maiúscula, minúscula e número.</p>
          <p class="field-error" id="password-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="confirm">Confirmar senha</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="confirm-error">
          <p class="field-error" id="confirm-error" aria-live="polite"></p>
        </div>
        <button class="btn btn-block" type="submit" id="submit">Criar conta</button>
      </form>

      <p class="switch">Já tem conta? <a href="/login">Entrar</a></p>
    </section>
  </main>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
